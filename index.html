<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>US Market Car Price Predictor</h2>
        <form action="/predict" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Engine Size (cubic inches/cc):</label>
                    <input type="number" step="any" name="enginesize" required>
                </div>
                <div class="form-group">
                    <label>Horsepower:</label>
                    <input type="number" step="any" name="horsepower" required>
                </div>
                <div class="form-group">
                    <label>Curb Weight (lbs):</label>
                    <input type="number" step="any" name="curbweight" required>
                </div>
                <div class="form-group">
                    <label>Highway MPG:</label>
                    <input type="number" step="any" name="highwaympg" required>
                </div>
                <div class="form-group">
                    <label>City MPG:</label>
                    <input type="number" step="any" name="citympg" required>
                </div>
                <div class="form-group">
                    <label>Wheelbase:</label>
                    <input type="number" step="any" name="wheelbase" required>
                </div>
                <div class="form-group">
                    <label>Car Width:</label>
                    <input type="number" step="any" name="carwidth" required>
                </div>
                <div class="form-group">
                    <label>Fuel Type:</label>
                    <select name="fueltype">
                        <option value="gas">Gas</option>
                        <option value="diesel">Diesel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Car Body:</label>
                    <select name="carbody">
                        <option value="sedan">Sedan</option>
                        <option value="hatchback">Hatchback</option>
                        <option value="wagon">Wagon</option>
                        <option value="hardtop">Hardtop</option>
                        <option value="convertible">Convertible</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Drive Wheel:</label>
                    <select name="drivewheel">
                        <option value="fwd">FWD</option>
                        <option value="rwd">RWD</option>
                        <option value="4wd">4WD</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn">Predict Price</button>
        </form>
        {% if prediction_text %}
        <div class="result">
            <h3>{{ prediction_text }}</h3>
        </div>
        {% endif %}
    </div>
</body>
</html>
